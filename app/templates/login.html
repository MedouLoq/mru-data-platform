<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MRU Data Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background:#28e08e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-section h1 {
            /* CHANGED: Blue to Green */
            color:  #94a3b8; 
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo-section p {
            color: #090c0d;
            font-size: 15px;
        }

        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-header {
            margin-bottom: 28px;
        }

        .form-header h2 {
            color:  #94a3b8;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-header p {
            color: #94a3b8;
            font-size: 14px;
        }

        .alert-error {
            background: #7f1d1d;
            border: 1px solid #991b1b;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 24px;
        }

        .alert-error p {
            color: #fca5a5;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-field {
            margin-bottom: 20px;
        }

        .form-field label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-field input {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .form-field input:focus {
            outline: none;
            /* CHANGED: Border Green */
            border-color: #34d399;
            /* CHANGED: Glow Green */
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.1); 
        }

        .form-field input::placeholder {
            color: #64748b;
        }

        .remember-row {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            cursor: pointer;
            /* CHANGED: Checkbox Green */
            accent-color: #34d399; 
        }

        .remember-row label {
            color: #cbd5e1;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            /* CHANGED: Button Background Green */
            background: #10b981; 
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            /* CHANGED: Hover Darker Green */
            background: #059669; 
            transform: translateY(-1px);
            /* CHANGED: Shadow Greenish */
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); 
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #334155;
        }

        .footer p {
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }

            .logo-section h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="logo-section">
            <h1>📊 MRU Platform</h1>
            <p>Currency & Commodity Data Analytics</p>
        </div>

        <div class="login-card">
            <div class="form-header">
                <h2>Welcome back</h2>
                <p>Sign in to your account to continue</p>
            </div>

            <div class="alert-error" style="display: none;">
                <p>⚠️ Invalid username or password. Please try again.</p>
            </div>

          <form method="post" action="/login/">
    {% csrf_token %}
    <div class="form-field">
        <label for="id_username">Username</label>
        <input 
            type="text" 
            id="id_username" 
            name="username"
            placeholder="Enter your username"
            autofocus
            required
        >
    </div>

    <div class="form-field">
        <label for="id_password">Password</label>
        <input 
            type="password" 
            id="id_password" 
            name="password"
            placeholder="Enter your password"
            required
        >
    </div>

    <div class="remember-row">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Keep me signed in</label>
    </div>

    <button type="submit" class="btn-submit">
        Sign In
    </button>

    <input type="hidden" name="next" value="/"></form>

            <div class="footer">
                <p>Secure access to market intelligence</p>
            </div>
        </div>
    </div>
</body>
</html>
